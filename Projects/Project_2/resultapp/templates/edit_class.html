{% extends 'admin_base.html' %}
{% block title %}Edit Class{% endblock %}
{% block admin_content %}
<h2 class="mb-4"><i class="fas fa-edit text-primary"></i> Edit Class</h2>
<div class="card shadow">
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Class Name</label>
                {{ form.class_name }}
                {% if form.class_name.errors %}
                <div class="text-danger">{{ form.class_name.errors }}</div>
                {% endif %}
            </div>
            <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i> Update</button>
            <a href="{% url 'manage-class' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
